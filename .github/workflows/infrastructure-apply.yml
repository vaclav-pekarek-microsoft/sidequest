name: Disabled infrastructure apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing separately approved infrastructure apply environment
        required: true
        type: choice
        options: [staging, production]

permissions: {}

concurrency:
  group: infrastructure-apply-${{ inputs.environment == 'production' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
      environment-id: ${{ steps.gate.outputs.environment-id }}
      source-sha: ${{ steps.gate.outputs.source-sha }}
    steps:
      - name: Reject non-main or repeated apply before checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "vaclav-pekarek-microsoft/sidequest" ||
                "$GITHUB_EVENT_NAME" != "workflow_dispatch" ||
                "$GITHUB_REF" != "refs/heads/main" ||
                "$GITHUB_RUN_ATTEMPT" != "1" ||
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ||
                "$GITHUB_WORKFLOW_SHA" != "$GITHUB_SHA" ||
                "$GITHUB_WORKFLOW_REF" != "vaclav-pekarek-microsoft/sidequest/.github/workflows/infrastructure-apply.yml@refs/heads/main" ]]; then
            echo "::error::Dispatch a fresh infrastructure apply run from this repository's main source."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify separate apply opt-in source CI and existing environment
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_ENABLED: ${{ vars.SIDEQUEST_INFRASTRUCTURE_APPLY_ENABLED }}
          APPLY_ADMIN_CONTROLS_VERIFIED: ${{ vars.SIDEQUEST_APPLY_ADMIN_CONTROLS_VERIFIED }}
        run: node infra/deployment/apply-workflow.mjs gate

  apply:
    needs: metadata
    if: ${{ needs.metadata.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: ${{ needs.metadata.outputs.environment }}
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reverify exact reviewed infrastructure then apply with application disabled
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY_ENABLED: ${{ vars.SIDEQUEST_INFRASTRUCTURE_APPLY_ENABLED }}
          APPLY_ADMIN_CONTROLS_VERIFIED: ${{ vars.SIDEQUEST_APPLY_ADMIN_CONTROLS_VERIFIED }}
          APPLY_EXPECTED_ENVIRONMENT_ID: ${{ needs.metadata.outputs.environment-id }}
          APPLY_EXPECTED_SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
          APPLY_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          APPLY_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          APPLY_CLIENT_ID: ${{ secrets.AZURE_APPLY_CLIENT_ID }}
          APPLY_PLANNING_CLIENT_ID: ${{ secrets.AZURE_PLANNING_CLIENT_ID }}
          APPLY_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          APPLY_PARAMETERS: ${{ secrets.SIDEQUEST_APPLY_PARAMETERS }}
          APPLY_APPROVAL: ${{ secrets.SIDEQUEST_APPLY_APPROVAL }}
        run: node infra/deployment/apply-workflow.mjs apply
