name: Read-only infrastructure planning

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Existing owner-approved environment to plan
        required: true
        type: choice
        options: [staging, production]

permissions: {}

concurrency:
  group: infrastructure-plan-${{ inputs.environment == 'production' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      deployments: read
    outputs:
      environment: ${{ steps.gate.outputs.environment }}
      environment-id: ${{ steps.gate.outputs.environment-id }}
      source-sha: ${{ steps.gate.outputs.source-sha }}
    steps:
      - name: Reject non-main or repeated dispatch before checkout
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "vaclav-pekarek-microsoft/sidequest" ||
                "$GITHUB_EVENT_NAME" != "workflow_dispatch" ||
                "$GITHUB_REF" != "refs/heads/main" ||
                "$GITHUB_RUN_ATTEMPT" != "1" ||
                ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ||
                "$GITHUB_WORKFLOW_SHA" != "$GITHUB_SHA" ||
                "$GITHUB_WORKFLOW_REF" != "vaclav-pekarek-microsoft/sidequest/.github/workflows/infrastructure-plan.yml@refs/heads/main" ]]; then
            echo "::error::Dispatch a fresh planning run from this repository's main source."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source CI and existing environment protections
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ENABLED: ${{ vars.SIDEQUEST_PLANNING_ENABLED }}
          PLAN_ADMIN_CONTROLS_VERIFIED: ${{ vars.SIDEQUEST_PLANNING_ADMIN_CONTROLS_VERIFIED }}
        run: node infra/deployment/plan-workflow.mjs gate

  plan:
    needs: metadata
    if: ${{ needs.metadata.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ needs.metadata.outputs.environment }}
    permissions:
      contents: read
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Reverify gates and produce only a sanitized read-only plan
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_ENABLED: ${{ vars.SIDEQUEST_PLANNING_ENABLED }}
          PLAN_ADMIN_CONTROLS_VERIFIED: ${{ vars.SIDEQUEST_PLANNING_ADMIN_CONTROLS_VERIFIED }}
          PLAN_EXPECTED_ENVIRONMENT_ID: ${{ needs.metadata.outputs.environment-id }}
          PLAN_EXPECTED_SOURCE_SHA: ${{ needs.metadata.outputs.source-sha }}
          PLAN_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          PLAN_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          PLAN_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          PLAN_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          PLAN_PARAMETERS: ${{ secrets.SIDEQUEST_PLAN_PARAMETERS }}
        run: node infra/deployment/plan-workflow.mjs plan
