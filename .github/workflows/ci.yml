name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start isolated SQL Server
        shell: bash
        run: |
          password="Sq1!$(openssl rand -hex 20)"
          echo "::add-mask::$password"
          echo "SIDEQUEST_TEST_SQL=Server=localhost,1433;User ID=sa;Password=$password;Encrypt=true;TrustServerCertificate=true" >> "$GITHUB_ENV"
          docker run --name sidequest-test-sql -d -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server:2022-latest
          ready=0
          for attempt in $(seq 1 60); do
            if docker exec sidequest-test-sql /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P "$password" -C -Q "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "SQL Server did not become ready."
            exit 1
          fi
      - run: dotnet restore Sidequest.slnx
      - run: dotnet build Sidequest.slnx --no-restore --configuration Release
      - name: Verify SCSS assets and local configuration boundaries
        run: npm run styles:test
      - name: Check offline and authentication lifecycle JavaScript
        run: node --test tests/Sidequest.BrowserTests/SecondaryExperience/snapshot-validation.test.mjs tests/Sidequest.BrowserTests/SecondaryExperience/worker-routing.test.mjs tests/Sidequest.BrowserTests/SecondaryExperience/host-lifecycle.test.mjs tests/Sidequest.BrowserTests/SecondaryExperience/offline-rendering.test.mjs tests/Sidequest.BrowserTests/SecondaryExperience/session-binding.test.mjs tests/Sidequest.BrowserTests/SecondaryExperience/browser-helper-diagnostics.test.mjs tests/Sidequest.BrowserTests/SecondaryExperience/foundation-login-diagnostics.test.mjs tests/Sidequest.BrowserTests/SecondaryExperience/startup-initializer-routing.test.mjs tests/Sidequest.BrowserTests/SecondaryExperience/moderation-diagnostics.test.mjs
      - run: dotnet test tests/Sidequest.UnitTests/Sidequest.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=unit.trx" --logger "console;verbosity=normal" --blame-hang --blame-hang-timeout 5min --blame-hang-dump-type none
      - run: dotnet test tests/Sidequest.IntegrationTests/Sidequest.IntegrationTests.csproj --no-build --configuration Release --logger "trx;LogFileName=integration.trx"
      - name: Verify read-only self-contained package startup
        shell: bash
        run: |
          set -euo pipefail
          package="${RUNNER_TEMP:?}/sidequest-readonly-package"
          dotnet publish src/Sidequest.Web/Sidequest.Web.csproj --configuration Release \
            --runtime linux-x64 --self-contained true --output "$package"
          test ! -e "$package/appsettings.Development.json"
          test ! -e "$package/appsettings.Development.example.json"
          app_pid=
          cleanup() {
            if [ -n "$app_pid" ] && kill -0 "$app_pid" 2>/dev/null; then
              kill "$app_pid"
              wait "$app_pid" || true
            fi
            chmod -R u+w "$package"
          }
          trap cleanup EXIT
          chmod -R a-w "$package"
          (
            cd "$package"
            export ASPNETCORE_ENVIRONMENT=Development
            export Authentication__Mode=Development
            export Delivery__Work__Enabled=false
            export ConnectionStrings__Sidequest="$SIDEQUEST_TEST_SQL;Database=SidequestReadonlyStartup"
            exec dotnet Sidequest.Web.dll --urls http://127.0.0.1:5079
          ) > "$RUNNER_TEMP/sidequest-readonly.log" 2>&1 &
          app_pid=$!
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5079/health/live >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo "The read-only published application did not start."
            cat "$RUNNER_TEMP/sidequest-readonly.log"
            exit 1
          fi
      - name: Install browser test runtime
        shell: pwsh
        run: tests/Sidequest.BrowserTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium
      - name: Start synthetic browser-test application
        shell: bash
        run: |
          export SIDEQUEST_SQL_CONNECTION="$SIDEQUEST_TEST_SQL;Database=SidequestBrowserCi"
          export ConnectionStrings__Sidequest="$SIDEQUEST_SQL_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          export Authentication__Mode=Development
          export DevelopmentData__Seed=false
          export Operations__Monitoring__Enabled=true
          export Delivery__Email__SenderAddress=calendar@sidequest.example.test
          dotnet tool restore
          dotnet ef database update --project src/Sidequest.Infrastructure --startup-project src/Sidequest.Infrastructure --configuration Release --no-build
          dotnet run --project src/Sidequest.Web --configuration Release --no-build --no-launch-profile -- --urls http://127.0.0.1:5078 > "$RUNNER_TEMP/sidequest-web.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/sidequest-web.pid"
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5078/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo "The synthetic browser-test application did not become ready."
            exit 1
          fi
      - name: Start isolated browser diagnostics
        id: browser_diagnostics
        shell: bash
        run: |
          docker exec -i sidequest-test-sql bash -c '
            export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"
            exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b
          ' < .github/sql/start-browser-diagnostics.sql
      - name: Run real browser checks
        shell: pwsh
        env:
          SIDEQUEST_BASE_URL: http://127.0.0.1:5078
        run: |
          dotnet test tests/Sidequest.BrowserTests/Sidequest.BrowserTests.csproj --no-build --configuration Release --logger "trx;LogFileName=browser.trx" --logger "console;verbosity=normal" --blame-hang --blame-hang-timeout 5min --blame-hang-dump-type none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require executed foundation scenarios
        shell: pwsh
        run: |
          $reports = @(
            "tests/Sidequest.UnitTests/TestResults/unit.trx",
            "tests/Sidequest.IntegrationTests/TestResults/integration.trx",
            "tests/Sidequest.BrowserTests/TestResults/browser.trx"
          )
          foreach ($path in $reports) {
            [xml]$result = Get-Content $path -ErrorAction Stop
            $counters = $result.TestRun.ResultSummary.Counters
            $total = [int]$counters.total
            if ($total -lt 1 -or [int]$counters.executed -ne $total -or [int]$counters.passed -ne $total) {
              throw "Every scenario must execute and pass in $path; empty or skipped suites are not acceptance evidence."
            }
          }
      - name: Capture isolated browser database deadlocks
        if: (failure() || cancelled()) && steps.browser_diagnostics.outcome == 'success'
        shell: bash
        run: |
          docker exec -i sidequest-test-sql bash -c '
            export SQLCMDPASSWORD="$MSSQL_SA_PASSWORD"
            exec /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -y 0
          ' < .github/sql/browser-deadlocks.sql > "$RUNNER_TEMP/sidequest-deadlocks.xml"
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            **/TestResults/**/Sequence*.xml
            ${{ runner.temp }}/sidequest-web.log
            ${{ runner.temp }}/sidequest-deadlocks.xml
          if-no-files-found: warn
      - name: Stop test application
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/sidequest-web.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/sidequest-web.pid")" 2>/dev/null || true
          fi
      - name: Stop isolated SQL Server
        if: always()
        run: docker rm --force sidequest-test-sql
